http {
    upstream logistics_backend {
        # max_fails=5: после 5 неудачных попыток сервер считается недоступным
        # fail_timeout=30s: проверка будет длиться 30 секунд и столько же сервер будет отключён
        server logistics.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            # Таймаут ответа — 3 секунды
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # Считать ошибкой: соединение, таймаут, 5xx
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 1;

            # Fallback при недоступности внешнего сервиса
            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            default_type application/json;
            return 503 '{"status":"unavailable","message":"Logistics service temporarily unavailable, please try again later"}';
        }
    }
}